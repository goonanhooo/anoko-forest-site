<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#9ebda2">
  <meta name="description" content="아노코의 눈으로 바라보는 조용한 숲. 치이카와, 하치와레, 우사기와 함께하는 3D 시뮬레이터.">
  <title>아노코의 숲</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M8 45Q4 20 25 18L31 3L38 18Q60 18 57 45Q51 62 32 60Q13 62 8 45' fill='%23fffaf0' stroke='%23564237' stroke-width='3'/%3E%3Ccircle cx='23' cy='36' r='4'/%3E%3Ccircle cx='43' cy='36' r='4'/%3E%3C/svg%3E">
  <style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b5cdb0}body{touch-action:none;overscroll-behavior:none}canvas{width:100%;height:100%;display:block;outline:none;touch-action:none}body::after{content:'';position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 140px #29422c20}body.eating::after{animation:gulp 2.6s ease-in-out}@keyframes gulp{0%,40%{background:transparent}67%{background:#482b28;box-shadow:inset 0 0 80px #1b1313}100%{background:transparent}}</style>
  <style>
    .controls{position:fixed;top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));z-index:2;margin:0;padding:11px 14px;border:1px solid #fff6;border-radius:12px;background:#f9fbefdb;color:#3f513b;font:12px/1.8 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;box-shadow:0 3px 18px #354a3110;pointer-events:none;user-select:none;backdrop-filter:blur(8px)}
    .controls p{margin:0}.controls kbd{font-family:inherit;font-size:11px;font-weight:600;color:#31452e}.controls .keys{display:inline-block;min-width:90px;margin-right:9px}
    @media(max-width:600px){.controls{top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));padding:8px 11px;font-size:11px;line-height:1.7}.controls .keys{min-width:84px}}
    @media(pointer:coarse){.controls-keyboard{display:none}}@media(pointer:fine){.controls-touch{display:none}}
  </style>
</head>
<body><canvas id="forest" tabindex="0" aria-label="아노코의 숲 3D 시뮬레이터"></canvas>
  <aside class="controls" aria-label="조작 안내">
    <div class="controls-keyboard">
      <p><span class="keys"><kbd>W A S D</kbd></span>이동 · 마우스로 시점</p>
      <p><span class="keys"><kbd>E</kbd> / 왼쪽 클릭</span>잡기</p>
      <p><span class="keys"><kbd>J</kbd> · <kbd>Q</kbd></span>저글링 · 내려놓기</p>
      <p><span class="keys"><kbd>G</kbd> / 오른쪽 클릭</span>잡아먹기</p>
      <p><span class="keys"><kbd>T</kbd> · <kbd>Space</kbd></span>춤추기 · 놀래키기</p>
      <p><span class="keys"><kbd>F</kbd> · <kbd>R</kbd></span>쓰다듬기 · 초기화</p>
    </div>
    <div class="controls-touch">
      <p>왼쪽 드래그 이동 · 오른쪽 드래그 시점</p>
      <p>탭 잡기/내려놓기 · 길게 눌러 잡아먹기</p>
      <p>두 손가락 춤 · 세 손가락 저글링</p>
    </div>
  </aside>
<script type="module" src="./game.js"></script></body>
</html>
